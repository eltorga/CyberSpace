<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palworld Pokedex & Card Generator</title>
    <!-- Remix Icons para UI -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Librerías -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #121826;
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --section-bg: rgba(18, 24, 38, 0.95);
            --section-border: #2a3b5c;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Controles Superiores */
        .controls {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--neon-blue);
            box-sizing: border-box;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        select, button {
            background: #1a2235;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            border-radius: 4px;
            outline: none;
        }
        
        select { flex-grow: 1; }
        button { cursor: pointer; text-transform: uppercase; font-weight: bold; }
        button:hover { background: var(--neon-blue); color: #000; }

        input[type="color"] {
            background: #1a2235;
            border: 1px solid var(--neon-blue);
            border-radius: 4px;
            height: 36px;
            cursor: pointer;
        }

        input[type="range"] {
            -webkit-appearance: none;
            background: #1a2235;
            height: 6px;
            border-radius: 3px;
            outline: none;
            border: 1px solid var(--neon-blue);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--neon-blue);
            cursor: pointer;
        }

        /* Tarjeta Principal */
        .pal-card {
            width: 730px;
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Bloques de Sección separados */
        .section-block {
            background: var(--section-bg);
            border: 2px solid var(--section-border);
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,240,255,0.05);
        }

        #sec-info {
            position: relative;
            overflow: hidden; 
        }
        
        .sec-bg-image {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%;
            height: auto; 
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }

        .info-grid, .bottom-info-grid, .pal-desc {
            position: relative;
            z-index: 1;
        }

        .section-block.render-mode {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            padding-left: 0px !important;
            padding-right: 0px !important;
            padding-bottom: 0px !important;
        }
        .section-block.render-mode::before {
            display: none !important;
        }

        .section-block::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            z-index: 2;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            border-bottom: 2px solid var(--neon-blue);
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 3;
        }

        .habitat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 3;
        }

        .habitat-toggle {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--text-main);
            display: flex;
            gap: 10px;
            position: relative;
            z-index: 3;
            cursor: pointer;
        }

        .habitat-toggle label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .icon-price { transform: scale(1.4); display: inline-block; }
        .icon-gender { transform: scale(1.4); display: inline-block; }
        .icon-drop { transform: scale(1.4); display: inline-block; }

        /* === SECCIÓN 1: Info Básica === */
        .info-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 25px;
            align-items: start;
        }

        .pal-image-container {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            border: 2px solid var(--neon-blue);
            position: relative;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pal-bg-img {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        .pal-image-container img#palImage {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
        }

        .pal-number {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 4px 10px;
            border-radius: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: white;
            border: 1px solid var(--neon-blue);
            z-index: 3;
        }

        .title-group h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            margin: 0;
            text-transform: uppercase;
            color: white;
            line-height: 1.1;
        }

        .title-group h3 {
            font-size: 16px;
            color: var(--neon-pink);
            margin: 5px 0 10px 0;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
        }

        .types-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .type-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .type-badge img { width: 18px; height: 18px; }

        .rarity-container {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rarity-label { 
            color: var(--text-main); 
            font-size: 15px; 
            font-weight: bold; 
            font-family: 'Inter', sans-serif;
        }

        .drops-title { color: var(--text-main); font-weight: bold; margin-bottom: 8px; font-size: 15px; }
        .drops-list { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 15px; }
        
        .drop-item {
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
        }

        .extra-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid var(--neon-pink);
        }
        
        .extra-label { 
            color: var(--text-main); 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            white-space: nowrap;
        }
        .extra-label i { color: var(--neon-blue); font-size: 16px; }
        
        .food-icons { display: flex; gap: 2px; }
        .food-icons img { width: 18px; height: 18px; }

        .gender-ratio { display: flex; align-items: center; white-space: nowrap; }

        .egg-info { display: flex; align-items: center; gap: 8px; color: #e1b12c; white-space: nowrap; }
        .egg-info img { width: 24px; height: 24px; }

        .bottom-info-grid {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }
        .grid-3-col { grid-template-columns: repeat(3, 1fr); }
        .grid-2-col { grid-template-columns: 1fr 1fr; margin-top: 15px; }
        
        .bottom-info-grid .extra-info-row { margin-bottom: 0; }

        .pal-desc {
            font-size: 15px;
            color: var(--text-main);
            line-height: 1.5;
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-left: 3px solid var(--neon-pink);
            border-radius: 4px;
            font-style: italic;
            margin-top: 20px; 
            width: 100%; 
            box-sizing: border-box;
        }

        /* === SECCIÓN 2: Work Suitability === */
        .work-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        
        .work-item {
            background: rgba(255,255,255,0.05);
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .work-item.inactive { opacity: 0.35; filter: grayscale(100%); }
        .work-item.active { border-color: var(--neon-blue); background: rgba(0,240,255,0.05); }
        .work-item-left { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
        .work-item-left img { width: 22px; height: 22px; object-fit: contain; }
        .work-level { font-size: 15px; font-weight: bold; color: var(--neon-blue); }

        /* === SECCIÓN 3: Base Stats === */
        .stat-bar-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .stat-label {
            width: 130px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-bar-bg {
            flex-grow: 1;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        
        .stat-bar-fill { height: 100%; border-radius: 3px; }
        .stat-value { width: 40px; text-align: right; font-family: 'Orbitron', sans-serif; font-weight: bold; color: #fff;}
        
        .movement-stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 25px;
            padding-top: 15px;
            font-size: 14px;
            color: var(--text-main);
            font-weight: bold;
            border-top: 1px dashed rgba(255,255,255,0.2);
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .movement-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            flex: 1;
        }
        
        .movement-item i {
            color: var(--neon-blue);
            font-size: 18px;
        }

        /* === SECCIÓN 4: Skills === */
        .skills-container { display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 1;}
        .skill-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .skill-card.partner-card { border-color: rgba(255,255,255,0.1); }
        .skill-header { display: flex; align-items: center; gap: 15px; }
        .skill-level {
            background: #e67e22; color: #000;
            font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: bold;
            padding: 6px 12px; border-radius: 4px;
        }
        
        .skill-title-block { display: flex; align-items: center; gap: 10px; }
        .skill-title-block img { width: 24px; height: 24px; }
        .skill-title-block h4 { margin: 0; font-size: 18px; font-family: 'Orbitron', sans-serif; }
        
        .skill-desc { margin: 0; color: var(--text-main); font-size: 14px; line-height: 1.4; margin-top: 5px; }
        
        .skill-stats {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            font-size: 13px; font-weight: 600; margin-top: 8px;
        }
        .skill-stats span {
            background: rgba(255,255,255,0.05); padding: 8px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* === SECCIÓN 5: Mapa === */
        .map-controls {
            display: flex; gap: 10px; align-items: center; font-weight: bold; margin-top: 15px;
            position: relative; z-index: 3;
        }
        .map-container {
            position: relative; width: 100%; border: 2px solid var(--neon-blue); border-radius: 8px;
            overflow: hidden; background: #000; line-height: 0; margin-top: 15px;
            z-index: 1;
            box-sizing: border-box; /* <--- Soluciona el recorte del borde derecho */
        }
        .map-container img { width: 100%; height: auto; display: block; }
        
        canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 2; cursor: crosshair;
            opacity: 0.6;
        }

        /* Indicador flotante del tamaño exacto del pincel */
        #brushCursor {
            position: absolute;
            border: 2px dashed #ffffff;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 10;
        }

        @keyframes pulseSuccess {
            0% { transform: scale(1); background-color: #2ed573; color: #000; }
            50% { transform: scale(1.05); background-color: #2ed573; color: #000; box-shadow: 0 0 15px #2ed573; }
            100% { transform: scale(1); background-color: #1a2235; color: #2ed573; }
        }
        .btn-copied {
            animation: pulseSuccess 0.8s ease;
            border-color: #2ed573 !important;
            color: #2ed573 !important;
        }

    </style>
</head>
<body>

    <!-- Controles -->
    <div class="controls" data-html2canvas-ignore>
        <div class="controls-row">
            <select id="palSelector" onchange="renderPal()"></select>
            <button id="langBtn" onclick="toggleLang()">🇺🇸 EN</button>
            <button onclick="downloadCard()"><i class="ri-download-2-line"></i> Generar Imágenes</button>
        </div>
    </div>

    <!-- Contenedor Principal -->
    <div class="pal-card" id="captureArea">
        
        <!-- SECCIÓN 1: Info Básica -->
        <div class="section-block download-section" id="sec-info">
            
            <img class="sec-bg-image" crossorigin="anonymous" src="https://wsrv.nl/?url=blogger.googleusercontent.com/img/a/AVvXsEhClVi0hOshD79IRDN1gzw1FEwrE8QSnb-Jgb9mFwl6SAQGEbrOcn16Vx0QhZbObeM_ZX_AjNNc-THsjs9FdKhDGn9ebtOpDlDYpHS8rwBGkQiibgTOCUeQqTaP6eLJobwjB5ORWrQQ_aW5Eis3wU84w33KIAdA3Y9aN-PxZjkMRuRFfo4etKgzrrq5Psue" alt="">

            <div class="info-grid">
                <div class="pal-image-container" id="palImageContainer">
                    <img class="pal-bg-img" crossorigin="anonymous" src="https://wsrv.nl/?url=blogger.googleusercontent.com/img/a/AVvXsEhClVi0hOshD79IRDN1gzw1FEwrE8QSnb-Jgb9mFwl6SAQGEbrOcn16Vx0QhZbObeM_ZX_AjNNc-THsjs9FdKhDGn9ebtOpDlDYpHS8rwBGkQiibgTOCUeQqTaP6eLJobwjB5ORWrQQ_aW5Eis3wU84w33KIAdA3Y9aN-PxZjkMRuRFfo4etKgzrrq5Psue" alt="">
                    
                    <img id="palImage" crossorigin="anonymous" src="" alt="Pal Image">
                    <div class="pal-number" id="palNumber"></div>
                </div>
                
                <div class="basic-info-right">
                    <div class="title-group">
                        <h1 id="palName"></h1>
                        <h3 id="palPrefix"></h3>
                    </div>
                    
                    <div class="types-container" id="palTypes"></div>
                    
                    <div class="rarity-container">
                        <span class="rarity-label lang-rarity"></span>
                        <span id="palRarityStars"></span>
                    </div>

                    <div class="drops-container">
                        <div class="drops-title"><span class="lang-drops"></span>:</div>
                        <div class="drops-list" id="palDrops"></div>
                    </div>

                    <div class="extra-info-row" style="margin-bottom: 0;">
                        <div class="extra-label" id="labelFood">Food:</div>
                        <div class="food-icons" id="palFoodIcons"></div>
                    </div>
                </div>
            </div>
            
            <div class="bottom-info-grid grid-3-col">
                <div class="extra-info-row">
                    <div class="extra-label" id="labelPrice"></div>
                    <div id="palPrice"></div>
                </div>

                <div class="extra-info-row">
                    <div class="extra-label" id="labelSize"><i class="ri-ruler-line"></i> Size:</div>
                    <div id="palSize"></div>
                </div>
                
                <div class="extra-info-row">
                    <div class="extra-label" id="labelCapture"><i class="ri-focus-2-line"></i> Capture:</div>
                    <div id="palCapture"></div>
                </div>
            </div>

            <div class="bottom-info-grid grid-2-col">
                <div class="extra-info-row">
                    <div class="extra-label" id="labelGender">Gender Ratio:</div>
                    <div class="gender-ratio" id="palGender"></div>
                </div>
                
                <div class="extra-info-row">
                    <div class="extra-label" id="labelEgg">Pal Egg:</div>
                    <div class="egg-info" id="palEgg"></div>
                </div>
            </div>

            <div class="pal-desc" id="palDesc"></div>
        </div>

        <!-- SECCIÓN 2: Work Suitability -->
        <div class="section-block download-section" id="sec-work">
            <div class="section-title"><span class="lang-work"></span></div>
            <div class="work-grid" id="palWork"></div>
        </div>

        <!-- SECCIÓN 3: Base Stats -->
        <div class="section-block download-section" id="sec-stats">
            <div class="section-title"><span class="lang-stats"></span></div>
            <div id="palStatsBars"></div>
            <div class="movement-stats" id="palMovement"></div>
        </div>

        <!-- SECCIÓN 4: Skills -->
        <div class="section-block download-section" id="sec-skills">
            <div class="section-title"><span class="lang-skills"></span></div>
            <div class="skills-container" id="palSkills"></div>
        </div>

        <!-- SECCIÓN 5: Mapa -->
        <div class="section-block download-section" id="sec-map">
            <div class="habitat-header">
                <div class="section-title" style="margin-bottom: 0;">Habitat <span id="habitatTitleSpan" style="color:#94a3b8; font-size:16px;">(Day)</span></div>
                <div class="habitat-toggle" data-html2canvas-ignore>
                    <label><input type="radio" name="habitatTime" value="day" checked onchange="toggleHabitatTime()"> Day</label>
                    <label><input type="radio" name="habitatTime" value="night" onchange="toggleHabitatTime()"> Night</label>
                </div>
            </div>
            
            <div class="map-controls" data-html2canvas-ignore>
                <input type="color" id="brushColor" value="#ffaa00" style="width: 40px; border:none; padding:0;">
                <i class="ri-brush-line" style="color:var(--text-muted); font-size:18px; margin-left:5px;"></i>
                <input type="range" id="brushSize" min="5" max="60" value="25" style="width: 80px;">
                <button onclick="clearAllStrokes()"><i class="ri-eraser-line"></i> <span class="lang-clear"></span></button>
                <button id="btnCopyHabitat" onclick="copyMapData()" style="border-color: #2ed573; color: #2ed573;"><i class="ri-clipboard-line"></i> <span class="lang-copy">Copiar Hábitat</span></button>
            </div>
            <div class="map-container" id="mapContainer">
                <img id="mapImage" crossorigin="anonymous" src="">
                <canvas id="mapCanvas"></canvas>
                <div id="brushCursor"></div>
            </div>
        </div>

    </div>

    <script>
        let palDatabase = [];
        let currentLang = 'en'; 
        
        let currentDayStrokes = [];
        let currentNightStrokes = [];
        let activeHabitat = 'day';

        const CORS_PROXY = "https://wsrv.nl/?url="; 
        const SHEET_ID = '11y6X5BSx4hym0S697MDcUDd2kZc2aCLoAU9tbUuyrSk'; 
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        const langDict = {
            es: {
                work: "Aptitud de Trabajo", drops: "Posibles Objetos", stats: "Estadísticas Base",
                skills: "Habilidades Activas", passive: "Habilidades Pasivas", mapPaint: "Pintar Hábitat:", clear: "Limpiar", copy: "Copiar Hábitat",
                none: "Ninguna", rarity: "Rareza:", power: "Poder", cooldown: "Enfriamiento", range: "Rango",

            if (activeHabitat === 'day') {
                currentDayStrokes = [...drawnStrokes];
            } else {
                currentNightStrokes = [...drawnStrokes];
            }

            activeHabitat = selectedRadio.value;

            if (activeHabitat === 'night') {
                colorInput.value = '#00a8ff'; 
            } else {

            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.globalAlpha = 1.0; 
            ctx.shadowBlur = 0; 

            const brushCursor = document.getElementById('brushCursor');
            const brushSizeInput = document.getElementById('brushSize');

            canvas.addEventListener('mouseenter', () => {
                brushCursor.style.display = 'block';
            });

            canvas.addEventListener('mouseleave', () => {
                brushCursor.style.display = 'none';
                isDrawing = false;
                currentStroke = null;
            });

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const currentBrushSize = parseFloat(brushSizeInput.value);
                const scaleX = canvas.clientWidth / canvas.width;
                const cssDiameter = currentBrushSize * scaleX;

                brushCursor.style.width = `${cssDiameter}px`;
                brushCursor.style.height = `${cssDiameter}px`;
                brushCursor.style.left = `${x}px`;
                brushCursor.style.top = `${y}px`;
                brushCursor.style.borderColor = document.getElementById('brushColor').value;

                if (isDrawing) {
                    draw(e);
                }
            });

            canvas.addEventListener('mousedown', (e) => { 
                isDrawing = true; 
                currentStroke = { 
                    color: document.getElementById('brushColor').value, 
                    size: document.getElementById('brushSize').value,
                    points: [] 
                };
                drawnStrokes.push(currentStroke);
                draw(e); 
            });

            canvas.addEventListener('mouseup', () => { isDrawing = false; currentStroke = null; });
        }

        function draw(e) {
            if (!isDrawing || !currentStroke) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            const rx = Math.round(x * 10) / 10;
            const ry = Math.round(y * 10) / 10;

            currentStroke.points.push([rx, ry]);
            redrawStrokes(drawnStrokes);
        }

        function clearAllStrokes() { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            drawnStrokes = [];
        }

        function redrawStrokes(strokes) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            strokes.forEach(stroke => {
                if (!stroke.points || stroke.points.length === 0) return;
                ctx.beginPath();
                ctx.strokeStyle = stroke.color;
                ctx.lineWidth = stroke.size || 25; 
                ctx.moveTo(stroke.points[0][0], stroke.points[0][1]);
                for (let i = 1; i < stroke.points.length; i++) {
                    ctx.lineTo(stroke.points[i][0], stroke.points[i][1]);
                }
                ctx.stroke();
            });
            drawnStrokes = strokes; 
        }

        function copyMapData() {
            if (activeHabitat === 'day') currentDayStrokes = [...drawnStrokes];
            else currentNightStrokes = [...drawnStrokes];

            const currentData = activeHabitat === 'day' ? currentDayStrokes : currentNightStrokes;
            if(currentData.length === 0) {
                alert("El mapa está vacío. Pinta algo primero.");
                return;
            }
            const code = JSON.stringify(currentData);
            
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.getElementById('btnCopyHabitat');
                const originalHTML = btn.innerHTML;
                
                btn.innerHTML = `<i class="ri-check-line"></i> Hábitat Copiado`;
                btn.classList.add('btn-copied');
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('btn-copied');
                }, 1200);
            }).catch(err => {
                console.error("Error al copiar: ", err);
                alert("Error al copiar el código.");
            });
        }

        async function downloadCard() {
            if (activeHabitat === 'day') currentDayStrokes = [...drawnStrokes];
            else currentNightStrokes = [...drawnStrokes];

            const sections = Array.from(document.querySelectorAll('.download-section'));
            const mapSection = sections.pop(); 
            const palName = document.getElementById('palName').textContent.replace(/[^a-z0-9]/gi, '_');
            
            sections.forEach(sec => sec.classList.add('render-mode'));
            mapSection.classList.add('render-mode');

            const captureSection = async (section, filename) => {
                let canvas = await html2canvas(section, {
                    backgroundColor: null,
                    scale: 2, 
                    useCORS: true,
                    allowTaint: false
                });

                return new Promise(async resolve => {
                    let blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                    const maxSize = 1950000; 

                    if (blob.size > maxSize) {
                        let scale = 0.9;
                        let tempCanvas = document.createElement('canvas');
                        let ctx = tempCanvas.getContext('2d');
                        
                        while (blob.size > maxSize && scale > 0.3) {
                            tempCanvas.width = canvas.width * scale;
                            tempCanvas.height = canvas.height * scale;
                            ctx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
                            ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                            blob = await new Promise(r => tempCanvas.toBlob(r, 'image/png'));
                            scale -= 0.1;
                        }
                    }

                    saveBlob(blob, filename);
                    resolve();
                });
            };

            function saveBlob(blob, filename) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = filename;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            }
            
            for(let i = 0; i < sections.length; i++) {
                await captureSection(sections[i], `${palName}_Seccion_${i+1}.png`);
                await new Promise(resolve => setTimeout(resolve, 600));
            }

            const hasDay = currentDayStrokes.length > 0;
            const hasNight = currentNightStrokes.length > 0;

            if (hasDay) {
                document.querySelector('input[value="day"]').checked = true;
                activeHabitat = 'day';
                document.getElementById('habitatTitleSpan').textContent = '(Day)';
                redrawStrokes(currentDayStrokes);
                await new Promise(resolve => setTimeout(resolve, 300));
                
                await captureSection(mapSection, `${palName}_Seccion_6_Day.png`);
                await new Promise(resolve => setTimeout(resolve, 600));
            }

            if (hasNight) {
                document.querySelector('input[value="night"]').checked = true;
                activeHabitat = 'night';
                document.getElementById('habitatTitleSpan').textContent = '(Night)';
                redrawStrokes(currentNightStrokes);
                await new Promise(resolve => setTimeout(resolve, 300));
                
                await captureSection(mapSection, `${palName}_Seccion_6_Night.png`);
                await new Promise(resolve => setTimeout(resolve, 600));
            }

            if (!hasDay && !hasNight) {
                await captureSection(mapSection, `${palName}_Seccion_6_Map.png`);
            }
            
            sections.forEach(sec => sec.classList.remove('render-mode'));
            mapSection.classList.remove('render-mode');
        }
    </script>
</body>
