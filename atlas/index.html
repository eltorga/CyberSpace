    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">

        <span class="brand-icon" aria-hidden="true"><svg width="27" height="27" viewBox="0 0 24 24" fill="none"><path d="M3 5.8a8.6 8.6 0 0 1 9 1.3 8.6 8.6 0 0 1 9-1.3v12.8a9 9 0 0 0-9 1.2 9 9 0 0 0-9-1.2V5.8Z" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/><path d="M12 7.1V19.8M6.2 9.8c1.4-.35 2.5-.24 3.6.3m4.4 0c1.1-.54 2.2-.65 3.6-.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>

        <div class="nav-label">EXPLORAR</div>

          <a href="#/favoritos" class="nav-link" data-nav="favoritos"><span class="nav-ico">♡</span> Favoritos</a>

        <nav id="collections-nav" class="navigation collections-nav"><span class="sidebar-empty">Cargando…</span></nav>
      </div>
      <div class="sidebar-bottom">
        <button type="button" class="button export-sidebar" id="sidebar-export-github" data-action="export-github" hidden><i class="fi fi-rr-cloud-upload"></i> Exportar a GitHub</button>
        <div class="sync-status"><span class="live-indicator"></span><span id="sync-label">Comprobando modo de acceso...</span></div>
        <span class="sidebar-caption" id="sidebar-count">Tus fichas, a tu manera</span>

      <header class="topbar">
        <button id="menu-toggle" class="icon-button mobile-menu" aria-label="Abrir menú">☰</button>
        <div class="breadcrumb-top" id="breadcrumb-top"><span>Biblioteca personal</span><span class="crumb-slash">/</span><strong>Inicio</strong></div>
        <div class="top-actions">
          <label class="search-wrap"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.9" cy="10.9" r="7.2"/><path d="m16.2 16.2 4.6 4.6"/></svg><input id="global-search" type="search" placeholder="Buscar personas, temas, libros…" autocomplete="off" aria-label="Buscar en toda la biblioteca"><kbd>/</kbd></label>

      <main id="main-content" class="main-content" tabindex="-1"><div class="skeleton-wrap"><div class="skeleton skeleton-hero"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div></main>

  </div>

  <input id="file-upload" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden>
  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
