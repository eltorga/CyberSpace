        // --- Manejo unificado de menús contextuales predictivos ---
        function createAutocomplete(input, list) {
            let div = document.createElement('div');
            div.className = 'autocomplete-list';
            input.parentElement.appendChild(div);

            input.addEventListener('input', function() {
                let val = this.value;
                div.innerHTML = '';
                if (!val) { div.style.display = 'none'; return; }
                
                let matches = list.filter(item => item.toLowerCase().includes(val.toLowerCase()));
                if (matches.length > 0) {
                    div.style.display = 'block';
                    matches.forEach(match => {
                        let divItem = document.createElement('div');
                        divItem.className = 'autocomplete-item';
                        divItem.innerHTML = match;
                        // Usamos mousedown para que ejecute el clic ANTES de que el input pierda el foco por blur
                        divItem.onmousedown = function(e) {
                            e.preventDefault(); 
                            input.value = match;
                            div.style.display = 'none';
                        };
                        div.appendChild(divItem);
                    });
                } else {
                    div.style.display = 'none';
                }
            });

            input.addEventListener('blur', function() {
                div.style.display = 'none';
            });
            input.addEventListener('focus', function() {
                if(this.value && div.children.length > 0) div.style.display = 'block';
            });
        }

                    if(!grouped[b.f]) grouped[b.f] = [];
                    grouped[b.f].push(b);
                });
                
                Object.keys(grouped).forEach(finca => {
                    optionsHtml += `<optgroup label="${finca}">`;
                    grouped[finca].forEach(box => {
                        optionsHtml += `<option value="${box.name}">${box.name}</option>`;
                    });
                    optionsHtml += `</optgroup>`;
                });
                
                selectElement.innerHTML = optionsHtml;
            }
            interactiveCalc(selectElement.closest('tr'), 'cost');
        }

        function handleDateSelection(select, arrivalSpan) {
            let val = select.value;
            if(!val) { arrivalSpan.innerText = ""; return; }
            let vData = vuelosData.find(v => v.fecha === val);
            arrivalSpan.innerText = vData ? vData.llegada : "";
        }

        function interactiveCalc(row, source) {
            const costInp = row.querySelector('.inp-cost');
            const priceInp = row.querySelector('.inp-price');
            const markupInp = row.querySelector('.inp-markup');
            
            const cost = parseFloat(costInp.value) || 0;
            const type = row.querySelector('.inp-boxtype').value;
            const stems = parseFloat(row.querySelector('.inp-stems').value) || 1;
            const baseVol = parseFloat(document.getElementById('global-base-vol').value) || 2;
            
            let dims = boxesData.find(b => b.name === type) || {l:100, w:30, h:20}; 
            let vol = 0;
            if (['QB','EB','HB','QB2','EB2','SB'].includes(type)) {
                vol = (dims.l * dims.w * dims.h) / 6000;
            } else {
                vol = ((dims.l+baseVol)*(dims.w+baseVol)*(dims.h+baseVol))/6000;
            }
            
            const duties = cost * 0.1586;
            const transp2 = (vol * 5.25) * 1.36;
            const transp = stems > 0 ? transp2 / stems : 0;
            const totalBase = cost + duties + transp;

            if (source === 'cost' || source === 'price') {
                const p = parseFloat(priceInp.value);
                if (p && p > 0) {
                    let m = 1 - (totalBase / (p * 0.96));
                    markupInp.value = (m * 100).toFixed(2);
                }
            }

            if (source === 'markup') {
                let mVal = markupInp.value;
                let m = parseFloat(mVal) / 100;
                if (!isNaN(m)) {
                    let p = totalBase / ((1 - m) * 0.96);
                    priceInp.value = p.toFixed(2);
                }
            }
        }

        function interactiveCalcAllRows() {
            document.querySelectorAll('#table-body tr').forEach(tr => interactiveCalc(tr, 'cost'));
        }

        // --- Inventario Predictivo Exclusivo con Clic ---
        function handleInvInput(input) {
            let val = input.value;
            let listDiv = input.nextElementSibling;
            
            if (val.trim().length > 0) {
                let matchRegex = val.match(/^(\d+)\s*(.*)$/);
                if (matchRegex) {
                    let num = matchRegex[1];
                    let text = matchRegex[2].toLowerCase();
                    let matches = vendorNames.filter(v => v.toLowerCase().includes(text));
                    
                    if (matches.length > 0) {
                        listDiv.innerHTML = '';
                        listDiv.style.display = 'block';
                        
                        matches.forEach(m => {
                            let divItem = document.createElement('div');
                            divItem.className = 'autocomplete-item';
                            divItem.innerHTML = num + ' ' + m;
                            // Generamos cápsula SÓLO si el usuario clica la opción explícitamente
                            divItem.onmousedown = function(e) {
                                e.preventDefault(); 
                                input.value = num + ' ' + m;
                                createTagFromInput(input);
                            };
                            listDiv.appendChild(divItem);
                        });
                    } else { listDiv.style.display = 'none'; }
                } else { listDiv.style.display = 'none'; }
            } else { listDiv.style.display = 'none'; }
        }

        function createTagFromInput(input) {
            let val = input.value.trim();
            if(!val) return;
            
            let row = input.closest('tr');
            let mainQty = parseFloat(row.querySelector('.inp-main-qty').value) || 0;
            let container = input.closest('.inv-container');
            
            let matchRegex = val.match(/^(\d+)\s+(.+)$/);
            if (!matchRegex) return; // Si por alguna razón el texto no cuadra, ignoramos.
            
            let q = parseFloat(matchRegex[1]);
            let v = matchRegex[2];
            let validVendor = vendorNames.find(name => name.toLowerCase() === v.toLowerCase());
            if(!validVendor) return;

            v = validVendor; 

            let currentSum = 0;
            container.querySelectorAll('.tag').forEach(t => currentSum += parseFloat(t.dataset.qty));

            if (currentSum + q > mainQty) {
                alert(`¡Error! El inventario (${currentSum + q}) no puede superar QTY (${mainQty}).`);
                return;
            }
            
            let tag = document.createElement('span');
            tag.className = 'tag';
            tag.innerHTML = `${q} ${v} <i class="ri-close-line ml-1 cursor-pointer font-bold hover:text-gray-500" onclick="this.parentElement.remove(); updateInventoryData(this.closest('.inv-container'));"></i>`;
            tag.dataset.val = `${q} ${v}`;
            tag.dataset.qty = q;
            
            container.insertBefore(tag, input.parentElement);
            
            input.value = '';
            input.nextElementSibling.style.display = 'none';
            updateInventoryData(container);
        }

        function updateInventoryData(container) {
            let tags = container.querySelectorAll('.tag');
            let data = [];
            tags.forEach(t => data.push(t.dataset.val));
            container.querySelector('.hidden-inventory-data').value = data.join(';');
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        function addRow() {
            rowCount++;
            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 group border-b border-gray-100";
            tr.id = 'row-' + rowCount;

            let boxOpts = `
                <option value="EB">EB</option>
                <option value="QB">QB</option>
                <option value="HB">HB</option>
                <option value="EB2">EB2</option>
                <option value="QB2">QB2</option>
                <option value="SB">SB</option>
                <option value="more" class="font-bold text-blue-600">Ver más...</option>
            `;

            let dateOpts = '<option value="" disabled selected>Seleccione...</option>';
            vuelosData.forEach(v => {
                dateOpts += `<option value="${v.fecha}">${v.diaStr}</option>`;
            });

            tr.innerHTML = `
                <td class="table-cell align-top">
                    <div class="relative w-full h-full">
                        <input type="text" class="notion-input font-medium" placeholder="Finca">
                    </div>
                </td>
                <td class="table-cell align-top"><input type="number" class="notion-input inp-main-qty font-bold" placeholder="0"></td>
                <td class="table-cell align-top">
                    <select class="notion-input inp-boxtype text-xs" onchange="handleBoxSelect(this)">
                        ${boxOpts}
                    </select>
                </td>
                <td class="table-cell align-top"><input type="number" class="notion-input inp-stems" placeholder="0" oninput="interactiveCalc(this.closest('tr'), 'cost')"></td>
                <td class="table-cell align-top"><input type="text" class="notion-input" placeholder="Variety"></td>
                <td class="table-cell align-top">
                    <textarea class="notion-input resize-none overflow-hidden w-full min-h-[30px]" rows="1" placeholder="Descripción" oninput="autoResizeTextarea(this)"></textarea>
                </td>
                <td class="table-cell align-top pt-[6px]">
                    <select class="notion-input font-medium text-xs bg-gray-50" onchange="handleDateSelection(this, this.closest('tr').querySelector('.arr-span'))">
                        ${dateOpts}
                    </select>
                </td>
                <td class="table-cell align-top text-center text-xs font-medium text-gray-700 pt-[12px]"><span class="arr-span"></span></td>
                <td class="table-cell align-top">
                    <div class="flex items-center gap-1">
                        <span class="text-gray-400 text-xs">$</span>
                        <input type="number" step="0.01" class="notion-input inp-cost font-medium" placeholder="0.00" oninput="interactiveCalc(this.closest('tr'), 'cost')">
                    </div>
                </td>
                <td class="table-cell align-top">
                    <div class="flex items-center gap-1">
                        <input type="number" step="0.1" class="notion-input inp-markup font-medium" placeholder="0.0" oninput="interactiveCalc(this.closest('tr'), 'markup')">
                        <span class="text-gray-400 text-xs">%</span>
                    </div>
                </td>
                <td class="table-cell align-top">
                    <div class="flex items-center gap-1">
                        <span class="text-gray-400 text-xs">$</span>
                        <input type="number" step="0.01" class="notion-input inp-price font-medium" placeholder="0.00" oninput="interactiveCalc(this.closest('tr'), 'price')">
                    </div>
                </td>
                <td class="table-cell align-top">
                    <div class="flex flex-wrap items-center gap-1 inv-container bg-white border border-transparent hover:border-gray-300 rounded p-1 transition">
                        <input type="hidden" class="hidden-inventory-data" value="">
                        <div class="relative w-[100px]">
                            <input type="text" class="notion-input inv-quick-input text-xs" placeholder="Ej: 1 B" oninput="handleInvInput(this)" onblur="this.nextElementSibling.style.display='none'" onfocus="handleInvInput(this)">
                            <div class="autocomplete-list"></div>
                        </div>
                    </div>
                </td>
                <td class="table-cell align-top text-center pt-[12px]"><input type="checkbox" checked class="w-4 h-4 cursor-pointer accent-blue-600"></td>
                <td class="table-cell align-top text-center pt-[12px]">
                    <button class="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition" onclick="this.closest('tr').remove()"><i class="ri-delete-bin-line"></i></button>
                </td>
            `;

            document.getElementById('table-body').appendChild(tr);
            createAutocomplete(tr.querySelector('td:nth-child(1) input'), fincasList);
        }

        // --- Exportación Plana de Información Calculada ---
        function exportExcel() {
            const wb = XLSX.utils.book_new();
            const rows = document.querySelectorAll('#table-body tr');
            const baseVol = parseFloat(document.getElementById('global-base-vol').value) || 2;
            
            const ws_data = [
                ["Finca", "Qty", "Type of Box", "Cantidad_Min", "Cantidad_QB", "Variedad", "Nombre", "Color", "Cost", "Markup", "Precio", "Guia", "FechaEntrega", "Duties", "Origen", "Box", "img", "Transport", "Largo2", "Ancho", "Alto", "Volumen", "Transport2", "Import Duties", "Total", "FincaID", "Inventarios", "SendEmail", "Comments", "Standing Orders"]
            ];

            rows.forEach((tr) => {
                const cells = tr.querySelectorAll('td');
                const Finca = cells[0].querySelector('input').value;
                const Qty = parseFloat(cells[1].querySelector('input').value) || 0;
                const Type = cells[2].querySelector('select').value;
                const Stems = parseFloat(cells[3].querySelector('input').value) || 0;
                const Variety = cells[4].querySelector('input').value;
                const Name = cells[5].querySelector('textarea').value;
                
                // Extrae valor directo tipo "2026-07-15"
                const DateVal = cells[6].querySelector('select').value; 
                
                const Cost = parseFloat(cells[8].querySelector('input').value) || 0;
                const Price = parseFloat(cells[10].querySelector('input').value) || 0;
                const Standings = cells[11].querySelector('.hidden-inventory-data').value;
                const Send = cells[12].querySelector('input').checked ? 'Y' : 'N';

                let vData = vuelosData.find(v => v.fecha === DateVal);
                let GuiaStr = "ERROR F";
                if(vData) {
                    if (['QB2','EB2'].includes(Type)) { GuiaStr = vData.colombia; } 
                    else { GuiaStr = vData.ecuador; }
                }

                let dims = boxesData.find(b => b.name === Type) || {l:100, w:30, h:20, f:"Estandar"}; 
                let Vol = 0;
                if (['QB','EB','HB','QB2','EB2','SB'].includes(Type)) { Vol = (dims.l * dims.w * dims.h) / 6000; } 
                else { Vol = ((dims.l+baseVol)*(dims.w+baseVol)*(dims.h+baseVol))/6000; }
                
                let Duties = Math.ceil((Cost * 0.1586) * 100) / 100;
                let Transport2 = Math.ceil(((Vol * 5.25) * 1.36) * 100) / 100;
                let Transport = Stems > 0 ? Math.ceil((Transport2 / Stems) * 100) / 100 : 0;
                let Total = Stems * Price * Qty;
                
                let FincaIDStr = (fincasList.indexOf(Finca) + 1).toString();
                if(FincaIDStr === "0") FincaIDStr = ""; 

                let MarkupVal = 0;
                if (Price > 0) { MarkupVal = 1 - ((Cost + Duties + Transport) / (Price * 0.96)); }
                let MarkupOut = MarkupVal;
                if (MarkupVal < 0) MarkupOut = "BAJO";
                if (MarkupVal > 1) MarkupOut = "ALTO";

                // Conversión directa a Identificadores ("1 Daniel" -> "dvalencia,")
                let InventariosStr = "";
                if(Standings) {
                    let stArray = Standings.split(';');
                    stArray.forEach(t => {
                        let matchRegex = t.trim().match(/^(\d+)\s+(.+)$/);
                        if(matchRegex) {
                            let invQty = parseInt(matchRegex[1]);
                            let invName = matchRegex[2];
                            let mappedID = vendorsData[invName];
                            if(mappedID && !isNaN(invQty)) {
                                InventariosStr += (mappedID + ",").repeat(invQty);
                            }
                        }
                    });
                }

                // Append como valores estáticos pre-calculados (sin fórmulas)
                ws_data.push([
                    Finca, Qty, Type, Stems, Stems, Variety, Name, "", Cost, MarkupOut, Price, GuiaStr, DateVal, 
                    Duties, 0, 1, 0, Transport, dims.l, dims.w, dims.h, Vol, Transport2, 0.1586, Total, 
                    FincaIDStr, InventariosStr, Send, "", Standings.replace(/;/g, "; ")
                ]);
            });

            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            XLSX.utils.book_append_sheet(wb, ws, "test");
            XLSX.writeFile(wb, "ECF_Aumento.xlsx");
        }

        window.onload = function() {
            renderSheet1();
            renderGuias();
            addRow();
        };
    </script>
