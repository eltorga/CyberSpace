<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Eltorga • Administración</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"><style>
:root{color-scheme:dark;--bg:#171d25;--panel:#202a36;--border:#3a404d;--accent:#66c0f4;--text:#c7d5e0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Arial}.shell{display:grid;grid-template-columns:225px 1fr;min-height:100vh}nav{background:#131922;border-right:1px solid var(--border);padding:25px 15px}nav h2{font-size:20px;color:white}nav button{display:block;width:100%;text-align:left;margin:7px 0;background:none;color:var(--text);border:0;padding:12px;border-radius:5px;cursor:pointer}nav button.active,nav button:hover{background:#2a475e;color:white}main{padding:30px;max-width:1100px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:#8f98a0}button,.btn{border:1px solid var(--border);background:#2a475e;color:white;padding:10px 14px;border-radius:5px;cursor:pointer}button.primary{background:#1d759c;border-color:#329ed0}button.danger{background:#682930}input,textarea,select{display:block;width:100%;margin:6px 0 16px;background:#101922;color:white;border:1px solid #45556b;border-radius:4px;padding:11px;font:inherit}textarea{min-height:130px;resize:vertical}label{display:block;color:#b9c7d4;font-size:13px}article{border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:20px;margin:15px 0}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.list{display:grid;gap:7px;margin-top:20px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;background:#222e3b}.item small{color:#8f98a0}#status{color:#75d4a4}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.hint{font-size:12px;color:#9caebd}.hidden{display:none}#preview{border:1px solid var(--border);padding:15px;border-radius:5px;overflow-wrap:anywhere}a{color:var(--accent)}.ri{color:var(--accent)}@media(max-width:800px){.shell{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:5px;padding:12px}nav h2{width:100%}nav button{width:auto;margin:0}main{padding:15px}.cols{grid-template-columns:1fr}}
</style><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script></head><body>
<div class="shell"><nav><h2><i class="ri-settings-3-line"></i> Eltorga Admin</h2><button data-tab="posts" class="active"><i class="ri-article-line"></i> Publicaciones</button><button data-tab="foros"><i class="ri-folder-line"></i> Foros y estructura</button><button data-tab="config"><i class="ri-layout-line"></i> Apariencia y sitio</button><button data-tab="reacciones"><i class="ri-emotion-happy-line"></i> Reacciones</button><button data-tab="media"><i class="ri-image-add-line"></i> Archivos multimedia</button><hr><a href="/" target="_blank">Ver foro <i class="ri-external-link-line"></i></a></nav><main><div class="top"><div><h1 id="heading">Publicaciones</h1><p id="subtitle" class="muted">Los cambios quedan en los archivos JSON locales.</p></div><span id="status"></span></div><section id="content"></section></main></div>
<script>
let DB={posts:[],foros:[],config:{}},tab='posts',editing=-1;
const $=id=>document.getElementById(id),escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(name,data){let response=await fetch(name,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let result=await response.json();if(!response.ok)throw Error(result.error||'Error');return result}
async function load(){for(const k of Object.keys(DB))DB[k]=await api('/api/'+k);show(tab)}
async function save(k){try{await api('/api/save/'+k,DB[k]);$('status').textContent='Guardado correctamente';setTimeout(()=>$('status').textContent='',4000)}catch(e){alert(e.message)}}
function show(t){tab=t;editing=-1;document.querySelectorAll('nav button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('heading').textContent=({posts:'Publicaciones',foros:'Foros y estructura',config:'Apariencia y sitio',reacciones:'Reacciones',media:'Archivos multimedia'})[t];if(t==='posts'||t==='foros')list();else if(t==='config')configUI();else if(t==='reacciones')reactionsUI();else mediaUI()}
document.querySelectorAll('nav button[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function list(){let key=tab,arr=DB[key];$('content').innerHTML=`<div class="bar"><button class="primary" onclick="edit(-1)"><i class="ri-add-line"></i> Nuevo</button><input id="filter" placeholder="Buscar por título, foro, sección..." style="margin:0;max-width:420px" oninput="filterList()"><span class="muted">${arr.length} registros</span></div><div class="list" id="recordList"></div>`;filterList()}
function filterList(){const val=$('filter').value.toLowerCase();$('recordList').innerHTML=DB[tab].map((x,i)=>({x,i})).filter(({x})=>Object.values(x).some(v=>String(v).toLowerCase().includes(val))).map(({x,i})=>`<button class="item" onclick="edit(${i})"><span>${escapeHTML(tab==='posts'?(x.TITULO||'Sin título'):((x.SECCION||'')+' / '+(x.FORO||'')+' / '+(x.SUBFORO||'')))}<br><small>${escapeHTML(x.ESTADO||'Borrador')}</small></span><i class="ri-pencil-line"></i></button>`).join('')||'<p>No hay coincidencias.</p>'}
const postFields=['ID','ESTADO','FORO','SUBFORO','TITULO','ETIQUETAS','POST'];
const foroFields=['ESTADO','SECCION','SECCION_ICO','FORO','FORO_RES','FORO_ICO','FORO_BAR','FORO_BG','SUBFORO','SUBFORO_RES','SUBFORO_ICO','SUBFORO_BAR','SUBFORO_BG','MICROFORO','MICROFORO_RES','MICROFORO_ICO','MICROFORO_BAR','MICROFORO_BG'];
function edit(index){editing=index;let kind=tab,arr=DB[kind],item=index<0?{}:arr[index],fields=kind==='posts'?postFields:foroFields;
 let fieldsHtml=fields.map(k=>{let val=item[k]??'';if(k==='ID')return `<label>Identificador permanente<input id="f_${k}" value="${escapeHTML(val)}" placeholder="Se crea automáticamente" readonly></label>`;
 if(k==='ESTADO')return `<label>Estado<select id="f_${k}"><option ${val==='Publicado'?'selected':''}>Publicado</option><option ${val!=='Publicado'?'selected':''}>Borrador</option></select></label>`;
 if(k==='POST')return `<label>Contenido Markdown<textarea id="f_${k}" style="height:330px" oninput="updatePreview()">${escapeHTML(val)}</textarea><div class="bar"><button onclick="uploadInto('posts','f_POST',true)">Subir imagen e insertar en el post</button><button onclick="updatePreview()">Actualizar vista previa</button></div><div id="preview"></div></label>`;
 if(k.endsWith(('_ICO','_BAR','_BG')))return `<label>${k} <span class="hint">Ruta de imagen o video local (también admite ri-... o si:... para iconos)</span><div class="bar"><input id="f_${k}" value="${escapeHTML(val)}" style="flex:1;min-width:180px"><button onclick="uploadInto('${k.endsWith('_ICO')?'foros':'fondos'}','f_${k}')">Subir</button></div></label>`;
 return `<label>${k}<input id="f_${k}" value="${escapeHTML(val)}"></label>`}).join('');
 $('content').innerHTML=`<article><h2>${index<0?'Crear':'Editar'} ${kind==='posts'?'publicación':'registro de foro'}</h2>${fieldsHtml}<div class="bar"><button class="primary" onclick="saveRecord()">Guardar cambios</button><button onclick="show('${kind}')">Cancelar</button>${index>=0?'<button class="danger" onclick="deleteRecord()">Eliminar</button>':''}</div></article>`;if(kind==='posts')updatePreview()}
function updatePreview(){const text=$('f_POST');if(text)$('preview').innerHTML=DOMPurify.sanitize(marked.parse(text.value))}
async function saveRecord(){let item=editing<0?{}:{...DB[tab][editing]};(tab==='posts'?postFields:foroFields).forEach(k=>item[k]=$('f_'+k).value);if(tab==='posts'&&!item.ID)item.ID='post-'+(globalThis.crypto?.randomUUID?.()||String(Date.now()));if(editing<0)DB[tab].push(item);else DB[tab][editing]=item;await save(tab);show(tab)}
async function deleteRecord(){if(!confirm('¿Eliminar este registro?'))return;DB[tab].splice(editing,1);await save(tab);show(tab)}
async function uploadInto(folder,target,asMarkdown=false){const inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/jpeg,image/webp,image/gif,image/avif,video/mp4,video/webm';inp.onchange=async()=>{try{if(!inp.files[0])return;let file=inp.files[0];let resp=await fetch('/api/upload/'+folder,{method:'POST',headers:{'X-Filename':encodeURIComponent(file.name)},body:file});let json=await resp.json();if(!resp.ok)throw Error(json.error);const el=$(target);if(el){if(asMarkdown)el.value+='\n\n!['+file.name+']('+json.path+')\n';else el.value=json.path;el.dispatchEvent(new Event('input'))}alert('Archivo guardado: '+json.path)}catch(e){alert(e.message)}};inp.click()}
function configUI(){const c=DB.config;let keys=['siteTitle','heroTitle','logo','heroMedia','globalBackground','avatar'];let fields=keys.map(k=>`<label>${k}<div class="bar"><input id="c_${k}" style="flex:1" value="${escapeHTML(c[k]||'')}">${['logo','heroMedia','globalBackground','avatar'].includes(k)?`<button onclick="uploadInto('${k==='logo'?'logos':k==='avatar'?'avatares':'fondos'}','c_${k}')">Subir</button>`:''}</div></label>`).join('');$('content').innerHTML=`<article><h2>Identidad visual</h2>${fields}<h3>Giscus</h3>${['enabled','repo','repoId','category','categoryId','theme','lang'].map(k=>`<label>${k}<input id="g_${k}" value="${escapeHTML(String((c.giscus||{})[k]??''))}"></label>`).join('')}<button class="primary" onclick="saveConfig()">Guardar configuración</button></article>`}
async function saveConfig(){let c=DB.config;['siteTitle','heroTitle','logo','heroMedia','globalBackground','avatar'].forEach(k=>c[k]=$('c_'+k).value);c.giscus=c.giscus||{};['enabled','repo','repoId','category','categoryId','theme','lang'].forEach(k=>c.giscus[k]=k==='enabled'?$('g_'+k).value==='true':$('g_'+k).value);await save('config')}
const reactionKeys=['THUMBS_UP','THUMBS_DOWN','LAUGH','HOORAY','CONFUSED','HEART','ROCKET','EYES'];
function reactionsUI(){let r=DB.config.reactions||{icons:{}};$('content').innerHTML=`<article><h2>Iconos de reacciones</h2><p class="muted">Giscus muestra las 8 reacciones oficiales de GitHub. Estas opciones se guardan para una futura capa visual personalizada; todavía <b>no reemplazan</b> los iconos dentro de Giscus.</p><label>Modo<select id="r_mode"><option value="native">Giscus nativo (funcional)</option><option value="custom" ${r.mode==='custom'?'selected':''}>Personalizado (reservado para futura versión)</option></select></label><div class="cols">${reactionKeys.map(k=>`<label>${k}<input id="r_${k}" value="${escapeHTML((r.icons||{})[k]||'')}"><span class="hint">Clase Remix Icon, por ejemplo ri-heart-line</span></label>`).join('')}</div><button class="primary" onclick="saveReactions()">Guardar preferencias</button></article>`}
async function saveReactions(){let r=DB.config.reactions=DB.config.reactions||{};r.mode=$('r_mode').value;r.icons=r.icons||{};reactionKeys.forEach(k=>r.icons[k]=$('r_'+k).value);await save('config')}
function mediaUI(){$('content').innerHTML=`<article><h2>Subir archivos</h2><p>Elige el tipo de contenido. Se guardará en su carpeta local de assets para subirlo posteriormente a GitHub.</p><label>Carpeta<select id="mediafolder">${['logos','foros','posts','avatares','fondos'].map(x=>`<option>${x}</option>`).join('')}</select></label><button class="primary" onclick="uploadInto($('mediafolder').value,'mediaresult')">Seleccionar imagen o video</button><label>Ruta generada<input id="mediaresult" readonly placeholder="Aquí aparecerá la ruta tras subir"></label></article>`}
load().catch(e=>$('content').textContent='No se pudieron cargar datos: '+e.message);
</script></body></html>
