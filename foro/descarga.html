<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Eltorga | Aviso de descarga</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171d25;color:#c7d5e0;font:16px system-ui,Arial;padding:20px}.panel{max-width:750px;background:#202a36;border:1px solid #3a404d;border-radius:9px;padding:42px;box-shadow:0 15px 40px #0007}h1{color:#fff}p{line-height:1.7}button{padding:14px 24px;background:#247ca7;border:0;border-radius:5px;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:#66c0f4}small{color:#8f98a0}</style></head><body><main class="panel"><h1>Aviso antes de descargar</h1><h2 id="file"></h2><p id="disclaimer"></p><p><strong>Importante:</strong> accederás a una página externa. Eltorga no garantiza el contenido ni la disponibilidad del enlace. Comprueba siempre los archivos antes de ejecutarlos.</p><p><small id="destination"></small></p><button id="continue" disabled>Continuar a la descarga</button><p><a href="./">Regresar a Eltorga</a></p></main><script>const p=new URLSearchParams(location.search);const url=p.get('url')||'';document.getElementById('file').textContent=p.get('title')||'Archivo';const valid=(()=>{try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)}catch{return false}})();document.getElementById('destination').textContent=valid?new URL(url).hostname:'Enlace no válido';const b=document.getElementById('continue');b.disabled=!valid;b.onclick=()=>{if(valid)window.open(url,'_blank','noopener,noreferrer')};fetch('data/config.json').then(r=>r.json()).then(c=>{document.getElementById('disclaimer').textContent=c.downloads?.disclaimer||'';const scripts=c.downloads?.scripts||'';if(scripts){const t=document.createElement('template');t.innerHTML=scripts;for(const node of t.content.querySelectorAll('script')){const sc=document.createElement('script');for(const a of node.attributes)sc.setAttribute(a.name,a.value);sc.textContent=node.textContent;document.body.append(sc)}}}).catch(()=>{});</script></body></html>
